<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1c1d" />
    <title>Offline — Hisaab</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: #1a1c1d;
        color: #e7e8ea;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 360px;
        width: 100%;
        text-align: center;
      }
      .logo {
        display: inline-grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #f0b429;
        color: #1a1c1d;
        font-weight: 700;
        font-size: 28px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #9aa0a6;
        margin: 0 0 24px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #9aa0a6;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
      }
      .dot.online { background: #22c55e; }
      button {
        margin-top: 20px;
        display: inline-block;
        padding: 10px 20px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: transparent;
        color: #e7e8ea;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { background: rgba(255, 255, 255, 0.05); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">₹</div>
      <h1>You're offline</h1>
      <p>Reconnect to the internet to load Hisaab. Your saved data is safe and will sync once you're back online.</p>
      <div class="status"><span class="dot" id="dot"></span><span id="label">Offline</span></div>
      <div>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
    <script>
      (function () {
        var dot = document.getElementById("dot");
        var label = document.getElementById("label");
        function update() {
          if (navigator.onLine) {
            dot.classList.add("online");
            label.textContent = "Back online — loading…";
            setTimeout(function () { location.reload(); }, 400);
          } else {
            dot.classList.remove("online");
            label.textContent = "Offline";
          }
        }
        window.addEventListener("online", update);
        window.addEventListener("offline", update);
        update();
      })();
    </script>
  </body>
</html>
